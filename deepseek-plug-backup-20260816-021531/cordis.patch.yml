# dsh-write-touch bundle patch: inserts this host plugin into a profile's
# layer stack. Installed through the CLI:
#
#   dsh plugin --profile <name> add dsh-write-touch@<version>
#
# or mounted manually by copying this package into the profile's node_modules
# and appending the same insert line to the profile's own cordis.patch.yml.
- insert:
    - id: write-touch
      name: 'dsh-write-touch'
